<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crate-digger-cpp</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --accent-color: #00ff9d;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: -0.05em;
        }
        .content {
            background: #111;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #333;
        }
        h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
            color: #ccc;
        }
        code {
            background: #222;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            color: #ddd;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>crate-digger-cpp</h1>
    </header>
    <main class="content">
        <p>No description available.</p>
    </main>
</body>
</html>
